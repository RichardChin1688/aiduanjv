<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费注册 - AI 短剧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="index.html" class="flex items-center">
                    <h1 class="text-2xl font-bold gradient-bg text-transparent bg-clip-text">
                        <i class="fas fa-film mr-2"></i>AI 短剧
                    </h1>
                </a>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-700 hover:text-purple-600 text-sm font-medium">返回首页</a>
                    <a href="login.html" class="text-gray-700 hover:text-purple-600 text-sm font-medium">登录</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Register Section -->
    <section class="py-20">
        <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-white rounded-2xl shadow-xl p-8">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">免费注册</h1>
                    <p class="text-gray-600">开启你的 AI 短剧创作之旅</p>
                    <div class="mt-4 inline-block bg-purple-100 text-purple-600 px-4 py-2 rounded-full text-sm font-medium">
                        <i class="fas fa-gift mr-2"></i>前 1000 名送¥100 创作基金
                    </div>
                </div>

                <form class="space-y-6">
                    <!-- Name -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            昵称
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" id="name" name="name" required
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                placeholder="给自己起个酷酷的名字">
                        </div>
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            手机号
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-phone text-gray-400"></i>
                            </div>
                            <input type="tel" id="phone" name="phone" required
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                placeholder="11 位手机号">
                        </div>
                        <p class="text-xs text-gray-500 mt-1">用于账号安全和找回密码</p>
                    </div>

                    <!-- Verification Code -->
                    <div>
                        <label for="code" class="block text-sm font-medium text-gray-700 mb-2">
                            验证码
                        </label>
                        <div class="flex space-x-4">
                            <div class="relative flex-1">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-shield-alt text-gray-400"></i>
                                </div>
                                <input type="text" id="code" name="code" required
                                    class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                    placeholder="6 位验证码">
                            </div>
                            <button type="button" class="px-6 py-3 border border-purple-600 text-purple-600 rounded-lg font-medium hover:bg-purple-50 transition">
                                获取验证码
                            </button>
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            密码
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="password" name="password" required
                                class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                placeholder="8-20 位，包含字母和数字">
                        </div>
                        <div class="mt-2">
                            <div class="flex space-x-1">
                                <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                                <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                                <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                                <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">密码强度：至少 8 位，包含字母和数字</p>
                        </div>
                    </div>

                    <!-- Agreement -->
                    <div class="flex items-start">
                        <input type="checkbox" id="agree" name="agree" required
                            class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded mt-1">
                        <label for="agree" class="ml-2 block text-sm text-gray-700">
                            我已阅读并同意
                            <a href="#" class="text-purple-600 hover:text-purple-500">《用户服务协议》</a>
                            和
                            <a href="#" class="text-purple-600 hover:text-purple-500">《隐私政策》</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full gradient-bg text-white py-3 rounded-lg font-medium hover:opacity-90 transition">
                        <i class="fas fa-rocket mr-2"></i>立即注册
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-gray-500">其他注册方式</span>
                    </div>
                </div>

                <!-- Social Register -->
                <div class="grid grid-cols-3 gap-4">
                    <button class="flex items-center justify-center py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fab fa-weixin text-green-600 text-xl"></i>
                    </button>
                    <button class="flex items-center justify-center py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fab fa-qq text-blue-500 text-xl"></i>
                    </button>
                    <button class="flex items-center justify-center py-3 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                        <i class="fab fa-weibo text-red-600 text-xl"></i>
                    </button>
                </div>

                <!-- Login Link -->
                <div class="mt-8 text-center">
                    <p class="text-gray-600">
                        已有账号？
                        <a href="login.html" class="text-purple-600 hover:text-purple-500 font-medium">
                            立即登录
                        </a>
                    </p>
                </div>
            </div>

            <!-- Benefits -->
            <div class="mt-8 bg-white rounded-xl shadow-lg p-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4 text-center">注册即享</h3>
                <div class="space-y-3">
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-500 mr-3"></i>
                        <span class="text-gray-700">每月 5 次免费 AI 剧本生成</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-500 mr-3"></i>
                        <span class="text-gray-700">使用基础剧本模板</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-500 mr-3"></i>
                        <span class="text-gray-700">发布作品到平台</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-500 mr-3"></i>
                        <span class="text-gray-700">70% 收益分成</span>
                    </div>
                    <div class="flex items-center">
                        <i class="fas fa-check-circle text-green-500 mr-3"></i>
                        <span class="text-gray-700">新人奖¥1000（播放&gt;10 万）</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-gray-400 text-sm">&copy; 2026 AI 短剧平台 aiduanju.com 版权所有</p>
        </div>
    </footer>
</body>
</html>
